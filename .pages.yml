# Konfigurasi panel Pages CMS untuk website Digital 313
media:
  input: gambar
  output: gambar
  rename: safe
  extensions: [png, jpg, jpeg, webp, svg]

content:
  - name: pengaturan
    label: Pengaturan umum
    type: file
    path: data/pengaturan.json
    format: json
    fields:
      - name: nama
        label: Nama / brand
        type: string
        required: true
      - name: logo
        label: Logo (opsional)
        type: image
        description: Jika kosong, nama brand ditampilkan sebagai teks.
      - name: judul_utama
        label: Judul utama di halaman depan
        type: text
      - name: teks_pembuka
        label: Kalimat di bawah judul utama
        type: text
      - name: nomor_wa
        label: Nomor WhatsApp
        type: string
        required: true
        description: Tulis seperti biasa, misalnya 081234567890. Website mengubahnya otomatis ke format yang benar.
      - name: pesan_wa
        label: Pesan awal WhatsApp
        type: text
        description: Kalimat yang otomatis terisi saat calon klien menekan tombol WhatsApp.
      - name: alamat
        label: Alamat (opsional)
        type: text
        description: Ditampilkan di bagian kontak. Kosongkan jika tidak ingin menampilkan alamat.

  - name: karya
    label: Karya digital
    type: file
    path: data/karya.json
    format: json
    list: true
    fields:
      - name: judul
        label: Judul karya
        type: string
        required: true
      - name: kategori
        label: Kategori
        type: string
        required: true
        description: Contoh Website, Aplikasi, Ebook, Desain. Tombol filter dibuat otomatis dari kategori yang kamu isi.
      - name: deskripsi
        label: Penjelasan singkat
        type: text
      - name: gambar
        label: Gambar karya
        type: image
      - name: link
        label: Link karya (opsional)
        type: string
        description: Harus diawali https://

  - name: jasa
    label: Jasa
    type: file
    path: data/jasa.json
    format: json
    list: true
    fields:
      - name: judul
        label: Nama jasa
        type: string
        required: true
      - name: deskripsi
        label: Penjelasan singkat
        type: text

  - name: cara-kerja
    label: Cara kerja
    type: file
    path: data/cara-kerja.json
    format: json
    list: true
    fields:
      - name: judul
        label: Nama langkah
        type: string
        required: true
      - name: deskripsi
        label: Penjelasan singkat
        type: text

  - name: pembayaran
    label: Ketentuan pembayaran
    type: file
    path: data/pembayaran.json
    format: json
    list: true
    fields:
      - name: judul
        label: Judul ketentuan
        type: string
        required: true
      - name: deskripsi
        label: Isi ketentuan
        type: text
